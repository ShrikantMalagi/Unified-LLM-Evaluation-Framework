[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-llm-evaluation-framework"
version = "0.1.0"
description = "A lightweight framework that routes LLM evaluation datasets to existing evaluation libraries."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Shrikant Malagi" },
]
maintainers = [
  { name = "Shrikant Malagi" },
]
keywords = ["llm", "evaluation", "rag", "deepeval", "ragas", "mlflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ShrikantMalagi/Unified-LLM-Evaluation-Framework"
Repository = "https://github.com/ShrikantMalagi/Unified-LLM-Evaluation-Framework"
Issues = "https://github.com/ShrikantMalagi/Unified-LLM-Evaluation-Framework/issues"

[project.optional-dependencies]
qa = ["deepeval"]
rag = ["ragas", "datasets", "pandas"]
mlflow = ["mlflow"]
dev = ["pytest", "ruff", "mypy", "build", "twine"]

[tool.setuptools]
packages = ["adapters", "core", "metrics", "runners"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: real Docker smoke tests; opt in with RUN_DOCKER_SMOKE=1",
  "backend: real optional-backend smoke tests; opt in with RUN_BACKEND_SMOKE=1",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["adapters", "core", "runners", "examples"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
